name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Web Application
        run: bun run build

      - name: Synchronize Capacitor Project
        run: |
          npx cap sync android
          rm -f android/app/src/main/assets/public/server.cjs*

      - name: Ensure Healthy Gradle Wrapper
        run: |
          echo "Checking Gradle Wrapper integrity..."
          if ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Corrupted gradle-wrapper.jar detected! Repairing with official clean wrapper..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          echo "Cleaning Gradle caches to prevent corrupted jar issues..."
          rm -rf ~/.gradle/caches/
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true
